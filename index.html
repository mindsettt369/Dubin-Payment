<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Services</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr;padding:28px;gap:28px}.sidebar{border-right:1px solid #e5e7eb;padding:12px 22px 12px 0}.menu{display:grid;gap:8px}.service{width:100%;display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid transparent;border-radius:12px;background:#fff;color:#111;text-align:left;font:inherit;font-weight:600;cursor:pointer;transition:.2s ease}.service:hover{background:#f7f7f7;border-color:#e5e7eb}.service.active{background:#f0f0f0;border-color:#e1e1e1}.service:focus-visible{outline:2px solid #111;outline-offset:2px}.icon{width:52px;height:36px;display:grid;place-items:center;flex:none}.service-logo{display:block;width:100%;height:100%;object-fit:contain}.name{font-size:15px}.detail{min-width:0;display:flex;align-items:center;justify-content:center;padding:12px 0}.panel{width:min(680px,100%);min-height:360px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;box-shadow:0 12px 32px rgba(17,17,17,.07);display:grid;place-items:center;padding:48px;animation:enter .28s ease both}.panel[hidden]{display:none}.panel-inner{text-align:center;display:grid;justify-items:center;gap:18px}.panel-logo{width:54px;height:54px;object-fit:contain}.panel-name{margin:0;font-size:16px;font-weight:600;color:#555}.panel-title{margin:0;font-size:38px;letter-spacing:-1.4px;line-height:1.05}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:680px){.app{display:flex;flex-direction:column;padding:18px;gap:18px}.sidebar{border-right:0;border-bottom:1px solid #e5e7eb;padding:0 0 18px}.menu{grid-template-columns:repeat(3,1fr);gap:7px}.service{flex-direction:column;justify-content:center;gap:7px;padding:12px 6px;text-align:center}.name{font-size:12px}.detail{padding:0}.panel{min-height:300px;padding:30px}.panel-title{font-size:32px}}
</style>
</head>
<body>
<main class="app">
<aside class="sidebar"><nav class="menu" aria-label="Payment services">
<button class="service active" type="button" aria-pressed="true" data-brand="Freecharge"><span class="icon" aria-hidden="true"><img class="service-logo" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-j2QQI2l5tXUMkv7Mvce6JTP7GSsTrU.png" alt=""></span><span class="name">Freecharge</span></button>
<button class="service" type="button" aria-pressed="false" data-brand="Paytm"><span class="icon" aria-hidden="true"><img class="service-logo" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-EOexTDXf3I7EUVoY4N3BXnldn8XRiO.png" alt=""></span><span class="name">Paytm</span></button>
<button class="service" type="button" aria-pressed="false" data-brand="MobiKwik"><span class="icon" aria-hidden="true"><img class="service-logo" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-etbO56OdCAxJNUOAaxcbq4WCxDFNTb.png" alt=""></span><span class="name">MobiKwik</span></button>
</nav></aside>
<section class="detail" aria-live="polite"><article class="panel" id="panel"><div class="panel-inner"><img class="panel-logo" src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-j2QQI2l5tXUMkv7Mvce6JTP7GSsTrU.png" alt="" aria-hidden="true"><p class="panel-name" id="brand">Freecharge</p><h1 class="panel-title">Coming Soon</h1></div></article></section>
</main>
<script>
const buttons=[...document.querySelectorAll('.service')],panel=document.querySelector('#panel'),brand=document.querySelector('#brand');
const logos={Freecharge:'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-j2QQI2l5tXUMkv7Mvce6JTP7GSsTrU.png',Paytm:'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-EOexTDXf3I7EUVoY4N3BXnldn8XRiO.png',MobiKwik:'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-etbO56OdCAxJNUOAaxcbq4WCxDFNTb.png'};
buttons.forEach(button=>button.addEventListener('click',()=>{buttons.forEach(item=>{item.classList.toggle('active',item===button);item.setAttribute('aria-pressed',item===button)});const selected=button.dataset.brand;brand.textContent=selected;panel.querySelector('.panel-logo').src=logos[selected];panel.classList.remove('panel');void panel.offsetWidth;panel.classList.add('panel');}));
</script>
</body>
</html>
